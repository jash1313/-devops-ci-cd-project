<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DevOps Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --bg-elevated: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --accent-green: #3fb950;
    --accent-blue: #58a6ff;
    --accent-amber: #d29922;
    --font-mono: 'JetBrains Mono', monospace;
    --font-body: 'Inter', system-ui, sans-serif;
  }
 
  * { box-sizing: border-box; }
 
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(63, 185, 80, 0.06), transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(88, 166, 255, 0.06), transparent 35%);
    color: var(--text);
    font-family: var(--font-body);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
 
  .terminal {
    width: 100%;
    max-width: 640px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.6);
    animation: rise 0.5s ease-out;
  }
 
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: #0d1117;
    border-bottom: 1px solid var(--border);
  }
 
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
 
  .terminal-title {
    margin-left: 8px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: var(--text-muted);
  }
 
  .terminal-body { padding: 36px 32px 32px; }
 
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-blue);
    margin: 0 0 10px;
  }
 
  h1 {
    font-family: var(--font-mono);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 28px;
    color: #f0f6fc;
  }
 
  .pipeline {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    margin-bottom: 28px;
  }
 
  .stage {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text);
    background: rgba(63, 185, 80, 0.08);
    border: 1px solid rgba(63, 185, 80, 0.35);
    border-radius: 5px;
    padding: 5px 10px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
 
  .stage::before {
    content: "✓";
    color: var(--accent-green);
    font-weight: 700;
  }
 
  .arrow { color: var(--text-muted); font-size: 13px; }
 
  .status-line {
    font-family: var(--font-mono);
    font-size: 14px;
    color: var(--accent-green);
    background: rgba(63, 185, 80, 0.07);
    border: 1px solid rgba(63, 185, 80, 0.25);
    border-radius: 6px;
    padding: 12px 14px;
    margin: 0 0 32px;
  }
 
  .status-line .tag {
    color: var(--accent-green);
    font-weight: 700;
    margin-right: 8px;
  }
 
  .cursor {
    display: inline-block;
    width: 7px;
    height: 14px;
    background: var(--accent-green);
    margin-left: 6px;
    vertical-align: -2px;
    animation: blink 1.1s steps(1) infinite;
  }
 
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .terminal { animation: none; }
  }
 
  @keyframes blink { 50% { opacity: 0; } }
 
  nav {
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--border);
    padding-top: 22px;
  }
 
  nav a {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 14px;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
 
  nav a::before {
    content: "$ cd ";
    color: var(--text-muted);
  }
 
  nav a:hover, nav a:focus-visible {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
    outline: none;
  }
</style>
</head>
<body>
  <div class="terminal">
    <div class="terminal-bar">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="terminal-title">~/devops-project — bash</span>
    </div>
    <div class="terminal-body">
      <p class="eyebrow">Pipeline Status</p>
      <h1>Welcome to my DevOps Project</h1>
 
      <div class="pipeline">
        <span class="stage">Code</span>
        <span class="arrow">→</span>
        <span class="stage">GitHub</span>
        <span class="arrow">→</span>
        <span class="stage">Actions</span>
        <span class="arrow">→</span>
        <span class="stage">Docker</span>
        <span class="arrow">→</span>
        <span class="stage">EC2</span>
        <span class="arrow">→</span>
        <span class="stage">Nginx</span>
      </div>
 
      <p class="status-line"><span class="tag">[OK]</span>Flask app running successfully<span class="cursor"></span></p>
 
      <nav>
        <a href="/about">/about</a>
        <a href="/health">/health</a>
      </nav>
    </div>
  </div>
</body>
</html>
